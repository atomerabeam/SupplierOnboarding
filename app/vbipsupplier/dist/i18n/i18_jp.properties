 agree to additional terms and conditions imposed by your financial institution for participation in VBIP. The types of transactions permitted for processing through VBIP may be specified or limited by your financial institution.</p><h5>2. Termination.</h5><p>Participation in VBIP is at the sole discretion of Visa, which may limit participation, impose conditions on its use, and discontinue all or part of VBIP at any time. Your license and right to use VBIP are effective until terminated. This License will terminate immediately without notice from Visa if you fail to comply with any provision of this License. You may terminate this License at any time upon notice to Visa.</p><p>Participation in VBIP is at the sole discretion of Visa, which may limit participation, impose conditions on its use, and discontinue all or part of VBIP at any time. Your license and right to use VBIP are effective until terminated. This License will terminate immediately without notice from Visa if you fail to comply with any provision of this License. You may terminate this License at any time upon notice to Visa.</p><h5>3. Fees.</h5><p>Visa does not charge you for use of VBIP available as of the date you agree to these Terms of Use. However, VBIP uses network services and may incur network data charges. While using VBIP, there may be fees charged by other third parties providing their services through VBIP, e.g. Business Payment Service Providers (\u201cBPSP\u201d). Any fees charged by BPSPs are between you and the BPSP, and subject to separate terms and conditions agreed between you and the BPSP. Visa may have other commercial arrangements in relation to VBIP, including with your issuer, BPSP, SAP and/or other third parties. Any such fees are paid directly between you and the BPSP (or the applicable third party). Visa\u2019s role is limited to displaying any fees chargeable by a third party to you based on such third party\u2019s instructions. Visa is not responsible for collecting, paying or transferring of any third party fees.</p></p><h5>4 Confidentiality and Privacy..</h5><p>(a) Consent. VBIP may access and process various confidential and personal information, whether provided directly by you on VBIP, through information pulled from the applicable SAP application that VBIP is embedded on, and/or any other sources. Such confidential and/or personal information may be processed by Visa, its subprocessors and/or subcontractors (including SAP and other service providers), the BPSP, your financial institution, and others. .</p><p>(b)You acknowledge that you have separately provided (and/or shall provide, as applicable) consent directly to your financial institution and the applicable BPSP to processing of confidential and/or personal information provided by you and/or processed through VBIP.</p><p>(c) Notwithstanding the above, you hereby confirm to Visa and provide additional consent that Visa may process any and all confidential and/or personal information provided by you and/or processed through VBIP on your behalf, including any transfers by Visa to third parties (including SAP, VBIP and other service providers).</p><p>(d)Information of Suppliers. Confidential and/or personal information provided by you and/or processed through VBIP on your behalf may include confidential and/or personal information of third parties, including your suppliers. You acknowledge and agree that you are responsible for and have obtained permission from such third parties for their confidential and/or personal information to be processed through VBIP. You authorize that VBIP may directly issue emails or other communications to your suppliers on your behalf.</p><p>(e)Referral to Issuers. If you have downloaded VBIP but do not have any Visa corporate cards issued to enroll on VBIP, you will be presented with an option to provide your contact details to a financial institution of your choice to be contacted about various corporate card options. Should you utilise such functionality, you hereby consent to Visa that your contact details can be disclosed by Visa to the selected financial institution to contact you. Any other information (whether confidential and/or personal) provided by you to the financial institution is outside Visa\u2019s control and subject to separate consent to be provided by you to the applicable financial institution.</p><h5>5 Intellectual Property Rights and License.</h5> <p>VBIP is provided to you by Visa Worldwide Pte Limited or another Visa entity within the region in which VBIP is made available to you (together with all other subsidiaries, affiliates, and licensers, collectively referred to as \u201cVisa\u201d). The Visa entity in your region grants you a non-exclusive, non-transferable royalty-free license to access the VBIP application (available on the SAP App Store) and such access to use VBIP is granted to you by conditioned on your acceptance without modification of these Terms of Use. The Services are licensed, to you by Visa for your personal use, AND ALL RIGHTS NOT EXPRESSLY GRANTED ARE RESERVED BY VISA OR ITS SUBSIDIARIES, AFFILIATES OR LICENSORS. Non-Financial Institution users are permitted access pursuant to the sponsorship of a Visa Financial Institution as a service to your sponsoring Visa Financial Institution. You may not transfer, distribute, sub-license, assign or grant any rights in VBIP in any form to any person without the prior written consent of Visa. As a condition to Visa granting consent, among any other conditions that Visa may require, any such transferee or licensee must agree to be bound by these Terms of Use. These Terms of Use are binding upon and inures for the benefit of you and your respective successors and assigns.</p><h5>6 Materials</h5>.<p> The information and materials provided through VBIP, including without limitation any data, text, graphics, images, audio and video clips, logos, icons, software and links (collectively the \u201cMaterials\u201d) are intended to